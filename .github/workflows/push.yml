name: Push to Replicate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cog.yaml"
      - "predict.py"
      - "script/**"

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - run: df -h /
      - uses: replicate/setup-cog@v2
        with:
          cog-version: v0.13.7
      - env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: echo "$REPLICATE_API_TOKEN" | docker login r8.im -u csviverdeia --password-stdin
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: cog push r8.im/csviverdeia/prithvi-sen1floods11 --secret id=HF_TOKEN,env=HF_TOKEN
